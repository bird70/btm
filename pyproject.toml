[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btm"
version = "4.0.0.dev0"
description = "Benthic Terrain Modeler — platform-agnostic core + Kaggle ML pipeline"
requires-python = ">=3.11"
dependencies = [
    "rasterio>=1.3",
    "numpy>=1.24",
    "scipy>=1.11",
    "openpyxl>=3.1",
    "scikit-image>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
]
# ML bridge: point-sampled BTM feature extraction for benthic_model pipeline
ml = [
    "pandas>=2.0",
]
# benthic_model Kaggle ML pipeline (src/benthic_model)
benthic = [
    "pandas>=2.0",
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "torch>=2.2",
    "transformers>=4.40",
    "datasets>=2.19",
    "evaluate>=0.4",
    "huggingface_hub>=0.22",
    "kaggle>=1.6",
]
# Optional segmentation stack (includes packages that may require platform-specific build tooling)
segmentation = [
    "pydensecrf>=1.0rc3",
]
# Install everything: pip install -e ".[dev,ml,benthic]"
all = ["btm[dev,ml,benthic,segmentation]"]

[project.scripts]
btm-bpi               = "btm.cli.bpi:main"
btm-standardize-bpi   = "btm.cli.standardize_bpi:main"
btm-slope             = "btm.cli.slope:main"
btm-vrm               = "btm.cli.vrm:main"
btm-surface-ratio     = "btm.cli.surface_ratio:main"
btm-classify          = "btm.cli.classify:main"
btm-run-model         = "btm.cli.run_model:main"
btm-depth-stats       = "btm.cli.depth_statistics:main"
btm-scale-compare     = "btm.cli.scale_comparison:main"
btm-export-features   = "btm.cli.export_features:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["btm*"]

[tool.setuptools.package-dir]
"benthic_model" = "src/benthic_model"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
markers = [
    "arcgis: requires ArcGIS Pro / arcpy",
    "qgis: requires QGIS / PyQGIS",
    "benthic: benthic_model ML pipeline tests (requires benthic extras)",
    "integration: end-to-end pipeline tests requiring fixture rasters in tests/data/",
]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
