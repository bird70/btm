# 019-T003 — RF + LightGBM soft-vote ensemble on BTM-10 feature set
# Combines R04 (rf-btm-fine) and lgbm-btm-tuned in a soft-vote ensemble
# Expected: similar to R04 CV=0.8024 if RF dominates
# Train with: --train-csv data/train_btm.csv
model_type: rf_lgbm_ensemble
seed: 42
cv:
  n_splits: 5
  fold_scheme: spatial_blocked
  random_state: 42
  spatial_bins: 4
feature_flags:
  include_focal_stats: false
  include_interactions: false
  include_spatial_z_scores: false
  include_btm_features: true
