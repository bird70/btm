# 020-RF-MLP-ENSEMBLE — Hybrid soft-vote: Random Forest (R04) + MLP
# RF contributes proven BTM tree partitioning; MLP contributes smooth boundary learning
# Default weights: 50% RF + 50% MLP (rf_weight=0.5)
# Train with: --train-csv data/train_btm.csv
model_type: rf_mlp_ensemble
seed: 42
cv:
  n_splits: 5
  fold_scheme: spatial_blocked
  random_state: 42
  spatial_bins: 4
feature_flags:
  include_focal_stats: false
  include_interactions: false
  include_spatial_z_scores: false
  include_btm_features: true
  include_eco_features: false
  exclude_coords: false
