# R04 — RF on MBES core 8 + BTM fine-scale terrain features
# Purpose: Add BTM library terrain features at fine scale
# Train with: --train-csv data/train_btm.csv (btm_* columns auto-included)
model_type: rf
seed: 42
cv:
  n_splits: 5
  fold_scheme: spatial_blocked
  random_state: 42
  spatial_bins: 4
feature_flags:
  include_focal_stats: false
  include_interactions: false
  include_spatial_z_scores: false
  include_btm_features: true
# BTM extraction scale: --fine-inner 1 --fine-outer 5
# Columns: btm_fine_bpi, btm_vrm, btm_slope
