# S1 — R04 setup + eco features (btm_depth_zone + btm_sgam_niche)
# Hypothesis: ordinal depth zone + SGAM niche improves rare-class recall
# without spatial non-stationarity risk (bins derived from train distribution)
model_type: rf
seed: 42
cv:
  n_splits: 5
  fold_scheme: spatial_blocked
  random_state: 42
  spatial_bins: 4
feature_flags:
  include_focal_stats: false
  include_interactions: false
  include_spatial_z_scores: false
  include_btm_features: true
  include_eco_features: true
