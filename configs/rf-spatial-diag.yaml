# R13 — DIAGNOSTIC: RF with spatial coordinates to quantify memorisation gap
# spatial_coords: true flags this as a diagnostic run, NOT the primary track
# Purpose: Intentionally reproduce v7-style spatial memorisation; Kaggle score
# expected to be << CV score, quantifying the leakage magnitude.
model_type: rf
spatial_coords: true
seed: 42
cv:
  n_splits: 5
  fold_scheme: spatial_blocked
  random_state: 42
  spatial_bins: 4
feature_flags:
  include_focal_stats: false
  include_interactions: false
  include_spatial_z_scores: true
  include_btm_features: false
