# R02 — RF on MBES core 8 only (no focal stats, no interactions, no spatial z-scores)
# Purpose: Isolate whether engineered features help or hurt
model_type: rf
seed: 42
cv:
  n_splits: 5
  fold_scheme: spatial_blocked
  random_state: 42
  spatial_bins: 4
feature_flags:
  include_focal_stats: false
  include_interactions: false
  include_spatial_z_scores: false
  include_btm_features: false
