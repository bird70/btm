# R07 — RF on MBES core 8 + focal stats (bathy_std, back_std, tpi)
# Purpose: Replicate v9 clean features in benthic_model pipeline
# Train with: --train-csv data/train.csv (no BTM columns needed)
model_type: rf
seed: 42
cv:
  n_splits: 5
  fold_scheme: spatial_blocked
  random_state: 42
  spatial_bins: 4
feature_flags:
  include_focal_stats: true
  include_interactions: false
  include_spatial_z_scores: false
  include_btm_features: false
